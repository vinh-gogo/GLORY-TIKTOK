name: CI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate Data & Schemas
        run: |
          python scripts/validate/validate.py

      - name: Validator test suite
        run: |
          python scripts/validate/test_validate.py

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Build Hugo Site
        run: |
          hugo --gc --minify

      - name: Check redirects are up to date
        run: |
          python scripts/build/gen_redirects.py --check

      - name: Check legacy URLs still resolve
        run: |
          python scripts/validate/check_urls.py
