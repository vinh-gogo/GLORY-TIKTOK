laws:
  - id: "law-01"
    number: "Định luật #01"
    name_vi: "Định luật về Hạn chót"
    name_en: "The Law of Deadlines"
    category: "workplace"
    category_name: "Hạn chót & Tiến độ"
    part: "Part 3 & Part 5"
    quote_en: "If you fail to prioritize tasks early, you will always sacrifice quality just to meet a tight deadline."
    quote_vi: "Nếu bạn không chủ động ưu tiên công việc từ sớm, bạn sẽ luôn phải đánh đổi chất lượng chỉ để kịp một hạn chót gấp gáp."
    insight: "Trong phòng thi TOEIC Speaking (Part 3 & 5), người chấm đánh giá rất cao khả năng liên kết nguyên nhân – hệ quả khi bàn về công việc. Hãy dùng cụm 'meet a tight deadline' kết hợp với 'prioritize high-impact tasks' để câu trả lời sắc sảo và tự nhiên."
    collocations:
      - term: "meet a tight deadline"
        meaning: "kịp hạn chót gấp gáp"
        link: "/words/deadline/"
      - term: "prioritize tasks"
        meaning: "sắp xếp thứ tự ưu tiên công việc"
        link: "/glossary/?q=prioritize"

  - id: "law-02"
    number: "Định luật #02"
    name_vi: "Định luật về Trì hoãn & Lịch trình"
    name_en: "The Law of Postponement"
    category: "workplace"
    category_name: "Hạn chót & Tiến độ"
    part: "Part 3 & Part 4"
    quote_en: "A meeting postponed without a concrete next step is not a solution; it is simply falling behind schedule in disguise."
    quote_vi: "Một cuộc họp bị dời lại mà không có bước đi cụ thể tiếp theo thì không phải giải pháp; đó chỉ là sự trễ nải tiến độ được ngụy trang."
    insight: "Khi trả lời các câu hỏi về thay đổi lịch trình trong Part 3 và Part 4, đừng chỉ nói 'I will postpone the meeting'. Hãy đưa ra hành động dứt khoát: đề xuất dời lịch cụ thể ('reschedule') hoặc cập nhật tiến độ để tránh 'falling behind schedule'."
    collocations:
      - term: "postpone"
        meaning: "hoãn lại, dời sang thời điểm khác"
        link: "/words/postpone/"
      - term: "reschedule"
        meaning: "sắp xếp lại lịch hẹn mới"
        link: "/words/reschedule/"
      - term: "fall behind schedule"
        meaning: "bị chậm tiến độ dự kiến"
        link: "/glossary/?q=schedule"

  - id: "law-03"
    number: "Định luật #03"
    name_vi: "Tiên đề về Đồng thuận Công sở"
    name_en: "The Consensus Axiom"
    category: "meetings"
    category_name: "Họp hành & Đồng thuận"
    part: "Part 3 & Part 5"
    quote_en: "Before you attempt to resolve conflicts, ensure that all stakeholders are truly on the same page regarding the core problem."
    quote_vi: "Trước khi cố gắng giải quyết mâu thuẫn, hãy đảm bảo tất cả các bên liên quan thực sự có cùng góc nhìn về gốc rễ vấn đề."
    insight: "Cụm thành ngữ 'on the same page' là 'vũ khí ăn điểm' cực mạnh trong câu hỏi Part 5 khi thảo luận giải pháp làm việc nhóm. Đi cùng với danh từ trang trọng 'stakeholders' và động từ 'resolve conflicts', câu nói của bạn mang phong thái của một quản lý chuyên nghiệp."
    collocations:
      - term: "on the same page"
        meaning: "cùng chung quan điểm, thấu hiểu như nhau"
        link: "/glossary/?q=page"
      - term: "resolve conflicts"
        meaning: "hòa giải, giải quyết xung đột bất đồng"
        link: "/glossary/?q=conflict"
      - term: "reach a consensus"
        meaning: "đạt được sự đồng thuận chung"
        link: "/glossary/?q=consensus"

  - id: "law-04"
    number: "Định luật #04"
    name_vi: "Nguyên tắc Trao đổi Nhanh"
    name_en: "The Touch-Base Principle"
    category: "meetings"
    category_name: "Họp hành & Đồng thuận"
    part: "Part 3 & Part 4"
    quote_en: "Never assume silence means agreement. Touch base frequently to keep expectations aligned before the project diverges."
    quote_vi: "Đừng bao giờ mặc định im lặng là đồng ý. Hãy thường xuyên trao đổi nhanh để mọi kỳ vọng luôn được thống nhất trước khi dự án lệch hướng."
    insight: "'Touch base' là phrasal verb kinh điển trong văn hóa làm việc tại các tập đoàn đa quốc gia. Thay vì nói 'I will talk to my team', nói 'I will touch base with my team' sẽ ghi điểm ngữ điệu giao tiếp công sở tự nhiên."
    collocations:
      - term: "touch base"
        meaning: "liên hệ nhanh để nắm tình hình"
        link: "/words/touch-base/"
      - term: "aligned expectations"
        meaning: "kỳ vọng được thống nhất đồng bộ"
        link: "/glossary/?q=expectation"

  - id: "law-05"
    number: "Định luật #05"
    name_vi: "Quy tắc Kế hoạch Dự phòng"
    name_en: "The Contingency Rule"
    category: "problem-solving"
    category_name: "Giải quyết sự cố"
    part: "Part 5"
    quote_en: "Amateurs hope everything goes smoothly; seasoned professionals devise a solid contingency plan to mitigate risks."
    quote_vi: "Người non trẻ hy vọng mọi thứ suôn sẻ; chuyên gia dày dạn luôn thiết lập phương án dự phòng vững chắc để giảm thiểu rủi ro."
    insight: "Part 5 TOEIC Speaking thường yêu cầu bạn đưa ra giải pháp xử lý sự cố (thiếu nhân sự, sự cố thiết bị, trễ hàng). Mở đầu bằng giải pháp tạm thời kết hợp với 'contingency plan to mitigate risks' là cấu trúc ăn trọn điểm Response Structure."
    collocations:
      - term: "contingency plan"
        meaning: "kế hoạch dự phòng cho tình huống bất ngờ"
        link: "/glossary/?q=contingency"
      - term: "mitigate risks"
        meaning: "giảm thiểu các mối nguy cơ rủi ro"
        link: "/glossary/?q=mitigate"

  - id: "law-06"
    number: "Định luật #06"
    name_vi: "Định luật Tinh thần Chủ động"
    name_en: "The Initiative Maxim"
    category: "mindset"
    category_name: "Thái độ & Bản lĩnh"
    part: "Part 5"
    quote_en: "Those who wait for explicit instructions will always follow; those who take the initiative will define the agenda and lead the outcome."
    quote_vi: "Những ai chỉ thụ động chờ chỉ thị sẽ mãi là người theo sau; người dám chủ động hành động mới là người làm chủ nghị trình và dẫn dắt kết quả."
    insight: "'Take the initiative' là collocation band điểm cao (Target/Advanced). Dùng cụm từ này khi bạn muốn nhấn mạnh tầm quan trọng của việc tự giác, dám chịu trách nhiệm và tiên phong giải quyết vấn đề trong tổ chức."
    collocations:
      - term: "take the initiative"
        meaning: "chủ động hành động, tiên phong đảm nhận"
        link: "/glossary/?q=initiative"
      - term: "define the agenda"
        meaning: "định hình chương trình nghị sự"
        link: "/glossary/?q=agenda"

  - id: "law-07"
    number: "Định luật #07"
    name_vi: "Quy tắc Dịch vụ Khách hàng"
    name_en: "The Customer Resolution Rule"
    category: "customer-service"
    category_name: "Khách hàng & Dịch vụ"
    part: "Part 3 & Part 4"
    quote_en: "The most effective way to address customer concerns is not with excuses, but with a prompt response and a cost-effective solution."
    quote_vi: "Cách hiệu quả nhất để giải tỏa bức xúc của khách hàng không phải là lời bào chữa, mà là phản hồi tức thì cùng một giải pháp tối ưu chi phí."
    insight: "Trong Part 3 (Respond to Questions) và Part 4 (Telephone Message), các tình huống khiếu nại của khách hàng xuất hiện liên tục. Hãy áp dụng bộ ba cụm từ: 'address customer concerns', 'prompt response', và 'cost-effective solution'."
    collocations:
      - term: "address customer concerns"
        meaning: "giải tỏa nỗi băn khoăn, khiếu nại của khách hàng"
        link: "/glossary/?q=concern"
      - term: "cost-effective solution"
        meaning: "giải pháp tiết kiệm chi phí mà vẫn hiệu quả"
        link: "/glossary/?q=cost-effective"
      - term: "prompt response"
        meaning: "phản hồi nhanh chóng, kịp thời"
        link: "/glossary/?q=prompt"

  - id: "law-08"
    number: "Định luật #08"
    name_vi: "Tiên đề về Kỳ vọng Vượt trội"
    name_en: "The Expectation Axiom"
    category: "mindset"
    category_name: "Thái độ & Bản lĩnh"
    part: "Part 3 & Part 5"
    quote_en: "Meeting expectations merely keeps you in the game; consistently exceeding expectations is what builds reputation and commands respect."
    quote_vi: "Đáp ứng kỳ vọng chỉ giúp bạn trụ lại cuộc chơi; liên tục vượt trên cả kỳ vọng mới là điều xây dựng danh tiếng và tạo dựng vị thế."
    insight: "Sự đối lập giữa 'meet expectations' (đáp ứng kỳ vọng mức trung bình) và 'exceed expectations' (vượt kỳ vọng) là lập luận đắt giá khi phát biểu quan điểm về đạo đức nghề nghiệp và tiêu chuẩn công việc trong Part 5."
    collocations:
      - term: "meet expectations"
        meaning: "đáp ứng đúng kỳ vọng đặt ra"
        link: "/glossary/?q=expectation"
      - term: "exceed expectations"
        meaning: "vượt xa sự mong đợi ban đầu"
        link: "/glossary/?q=exceed"

  - id: "law-09"
    number: "Định luật #09"
    name_vi: "Định luật Tinh gọn Quy trình"
    name_en: "The Streamline Law"
    category: "leadership"
    category_name: "Lãnh đạo & Năng suất"
    part: "Part 5"
    quote_en: "Productivity is never about working overtime; it is about streamlining the process and allocating resources where value is created."
    quote_vi: "Năng suất không bao giờ đo bằng số giờ làm thêm; mà đo bằng việc tinh gọn quy trình và phân bổ nguồn lực vào nơi sinh ra giá trị cao."
    insight: "Hai động từ hành động cao cấp: 'streamline' (tinh gọn hóa) và 'allocate' (phân bổ) thường xuyên xuất hiện ở mức điểm 160–200 TOEIC Speaking. Chúng thể hiện tư duy hệ thống và năng lực hoạch định của ứng viên."
    collocations:
      - term: "streamline the process"
        meaning: "tinh giản quy trình làm việc cho hiệu quả hơn"
        link: "/glossary/?q=streamline"
      - term: "allocate resources"
        meaning: "phân bổ nhân lực và tài nguyên hợp lý"
        link: "/glossary/?q=allocate"

  - id: "law-10"
    number: "Định luật #10"
    name_vi: "Định luật Đối chuẩn Đo lường"
    name_en: "The Benchmark Principle"
    category: "leadership"
    category_name: "Lãnh đạo & Năng suất"
    part: "Part 5"
    quote_en: "You cannot improve what you refuse to quantify. Establish a rigorous benchmark to measure performance without bias."
    quote_vi: "Bạn không thể cải thiện điều bạn từ chối định lượng. Hãy thiết lập một cột mốc chuẩn mực để đo lường hiệu suất một cách khách quan."
    insight: "Cụm danh từ 'benchmark' và động từ 'measure performance' là công cụ tuyệt vời để củng cố các luận điểm mang tính đo lường định lượng khi bạn cần bảo vệ một chính sách hoặc phương pháp cải tiến trong công ty."
    collocations:
      - term: "establish a benchmark"
        meaning: "thiết lập cột mốc tiêu chuẩn đối sánh"
        link: "/words/benchmark/"
      - term: "measure performance"
        meaning: "đo lường đánh giá hiệu suất công việc"
        link: "/glossary/?q=performance"

  - id: "law-11"
    number: "Định luật #11"
    name_vi: "Nguyên tắc Thích ứng & Đổi mới"
    name_en: "The Adaptation Rule"
    category: "leadership"
    category_name: "Lãnh đạo & Năng suất"
    part: "Part 5"
    quote_en: "In an evolving marketplace, rigid organizations crumble. Those who adapt to changes and broaden their horizons thrive."
    quote_vi: "Trong một thị trường luôn biến động, sự cứng nhắc sẽ tự sụp đổ. Những ai biết linh hoạt thích ứng và không ngừng mở rộng tầm nhìn mới là kẻ trường tồn."
    insight: "Cặp cụm từ 'adapt to changes' và 'broaden horizons' là mẫu câu hoàn hảo khi gặp đề thi hỏi về việc có nên cử nhân viên đi đào tạo, áp dụng công nghệ mới hay luân chuyển vị trí công tác."
    collocations:
      - term: "adapt to changes"
        meaning: "thích ứng linh hoạt trước sự thay đổi"
        link: "/glossary/?q=adapt"
      - term: "broaden horizons"
        meaning: "mở rộng tầm hiểu biết và kinh nghiệm"
        link: "/glossary/?q=horizon"

  - id: "law-12"
    number: "Định luật #12"
    name_vi: "Quy tắc Trách nhiệm Toàn diện"
    name_en: "The Ownership Law"
    category: "mindset"
    category_name: "Thái độ & Bản lĩnh"
    part: "Part 5"
    quote_en: "When an operation encounters a setback, mediocre minds assign blame; true professionals take full responsibility and troubleshoot immediately."
    quote_vi: "Khi hoạt động gặp phải trở ngại, kẻ tầm thường sẽ tìm người để đổ lỗi; chuyên gia chân chính sẽ nhận trọn trách nhiệm và bắt tay vào khắc phục ngay."
    insight: "Bộ ba từ vựng quyền lực 'encounter a setback', 'take full responsibility' và 'troubleshoot' (tìm lỗi xử lý kỹ thuật) giúp câu trả lời xử lý sự cố trong Part 5 toát lên bản lĩnh của người làm việc có trách nhiệm."
    collocations:
      - term: "take full responsibility"
        meaning: "chịu hoàn toàn trách nhiệm"
        link: "/glossary/?q=responsibility"
      - term: "troubleshoot"
        meaning: "rà soát và xử lý sự cố kỹ thuật"
        link: "/glossary/?q=troubleshoot"
      - term: "encounter a setback"
        meaning: "gặp phải trở ngại, sự cố bất ngờ"
        link: "/glossary/?q=setback"
