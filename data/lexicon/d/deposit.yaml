schema_version: 2
id: deposit
lemma: deposit
pos:
- noun
- verb
ipa:
  us: /dɪˈpɑːzɪt/
  uk: /dɪˈpɒzɪt/
level:
  band: core
  cefr: B1
  basis: TOEIC 650
topics:
- real-estate-construction
- finance-accounting
speaking_use:
- respond-with-info
- respond-to-questions
senses:
- id: deposit-1
  meaning_vi: Tiền đặt cọc giữ chỗ hoặc tiền bảo đảm thuê nhà; tiền gửi tiết kiệm ngân hàng
  note_vi: Khoản tiền trả trước để đảm bảo hợp đồng hoặc giữ tài sản an toàn.
confused_words:
- word: withdraw
  ipa: /wɪðˈdrɔː/
  difference_vi: Deposit tiền là gửi tiền vào tài khoản; withdraw là rút tiền ra.
confusing_meanings:
- difference_vi: Security deposit = tiền đặt cọc bảo đảm tài sản thuê; bank deposit = tiền gửi vào ngân hàng.
collocations:
- phrase: security deposit
  meaning_vi: tiền đặt cọc bảo đảm tài sản thuê
  evidence: corpus
- phrase: refundable deposit
  meaning_vi: khoản tiền đặt cọc có thể hoàn trả lại
  evidence: corpus
- phrase: deposit money into an account
  meaning_vi: nộp tiền vào tài khoản ngân hàng
  evidence: corpus
synonyms:
- word: down payment
  meaning_vi: khoản tiền trả trước
- word: advance payment
  meaning_vi: tiền tạm ứng
examples:
- en: The tenant paid two months' rent as a refundable security deposit prior to moving in.
  vi: Người thuê đã trả hai tháng tiền nhà làm khoản đặt cọc bảo đảm có hoàn lại trước khi chuyển vào ở.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /ˈpɑːz/, chữ 's' phát âm thành âm /z/ rung.
review:
