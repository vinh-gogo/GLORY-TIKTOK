schema_version: 3
id: discard
lemma: discard
pos:
- verb
ipa:
  us: /dɪˈskɑːrd/
  uk: /dɪˈskɑːd/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- manufacturing
- offices
senses:
- id: discard-1
  meaning_vi: Vứt bỏ, loại bỏ các vật phẩm phế liệu hoặc tài liệu không còn dùng được
  note_vi: Bỏ đi những thứ không còn giá trị sử dụng.
collocations:
- phrase: discard damaged goods
  meaning_vi: vứt bỏ hàng hóa đã bị hư hại
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: properly discard
  meaning_vi: thải bỏ đúng cách theo quy định
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: discard waste
  meaning_vi: vứt bỏ rác thải sản xuất
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: throw away
  meaning_vi: vứt đi
- word: dispose of
  meaning_vi: tiêu hủy, xử lý rác
- word: get rid of
  meaning_vi: loại trừ, dẹp bỏ
confused_words:
- word: discount
  ipa: /ˈdɪskaʊnt/
  difference_vi: Discount là giảm giá; discard là vứt bỏ, thải loại đi.
confusing_meanings:
- difference_vi: Discard damaged materials = loại bỏ vật liệu hư hỏng; discard an idea = từ bỏ một ý tưởng.
examples:
- en: Hazardous chemicals must be discarded in designated containment barrels according to safety laws.
  vi: Hóa chất nguy hại phải được thải bỏ vào các thùng chứa chuyên dụng theo đúng luật an toàn.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /ˈskɑːrd/, âm /r/ uốn lưỡi rõ trong giọng Mỹ.
