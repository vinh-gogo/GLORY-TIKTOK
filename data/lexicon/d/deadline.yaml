schema_version: 3
id: deadline
lemma: deadline
pos:
- noun
ipa:
  us: /ˈdedlaɪn/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- offices
senses:
- id: deadline-1
  meaning_vi: Hạn chót, thời hạn cuối cùng phải hoàn thành công việc
collocations:
- phrase: meet a deadline
  meaning_vi: Kịp hạn chót, hoàn thành đúng hạn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: miss a deadline
  meaning_vi: Trễ hạn chót, không kịp tiến độ
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: tight deadline
  meaning_vi: Hạn chót gấp gáp, thời gian rất ngắn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: extend the deadline
  meaning_vi: Gia hạn thêm thời gian nộp
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: target date
  meaning_vi: ngày mục tiêu
confused_words:
- ref: timeline
  word: timeline
  ipa: /ˈtaɪmlaɪn/
  meaning: Tiến độ / mốc thời gian tổng thể của dự án
  kind: spelling-sound
  difference_vi: Deadline là 1 mốc chót cố định; timeline là toàn bộ lộ trình các giai đoạn
- ref: lifeline
  word: lifeline
  ipa: /ˈlaɪflaɪn/
  meaning: Dây an toàn / phao cứu sinh / sự trợ giúp cứu cánh
  kind: spelling-sound
  difference_vi: Tránh phát âm nhầm âm đầu dead- /ˈded/ thành life- /ˈlaɪf/
confusing_meanings:
- ref: due-date
  word: due date
  meaning: Ngày đến hạn (thanh toán hóa đơn, nộp bài tập)
  difference_vi: Deadline dùng cho áp lực hoàn thành công việc/dự án; due date là ngày đáo hạn tiền bạc hoặc giấy tờ
examples:
- en: We often have to work overtime to meet tight deadlines at the end of the quarter.
  vi: Chúng tôi thường phải làm thêm giờ để kịp các hạn chót gấp gáp vào cuối quý.
review:
  status: ai_cross_checked
  checked_by:
  - cmudict
  - ai-model-cross-check
  checked_at: '2026-10-10'
