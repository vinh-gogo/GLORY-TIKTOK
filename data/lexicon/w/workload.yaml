    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: volume of work
  meaning_vi: lượng việc
confused_words:
- ref: workplace
  word: workplace
  ipa: /ˈwɜːrkpleɪs/
  meaning: Nơi làm việc, công sở, văn phòng
  kind: spelling-sound
  difference_vi: Workload là số lượng việc; workplace là địa điểm làm việc vật lý
- ref: download
  word: download
  ipa: /ˌdaʊnˈloʊd/
  meaning: Tải dữ liệu từ mạng xuống thiết bị
  kind: spelling-sound
  difference_vi: Tránh nhầm phần gốc -load; workload là lượng việc cần gánh vác
confusing_meanings:
- ref: duty
  word: duty
  meaning: Nhiệm vụ, bổn phận theo chức danh
  difference_vi: Workload là khối lượng thực tế phải làm; duty là phạm vi trách nhiệm theo hợp đồng
examples:
- en: To handle a heavy workload effectively, I usually prioritize urgent tasks first thing in the morning.
  vi: Để xử lý khối lượng công việc lớn một cách hiệu quả, tôi thường ưu tiên các nhiệm vụ khẩn cấp vào đầu buổi sáng.
