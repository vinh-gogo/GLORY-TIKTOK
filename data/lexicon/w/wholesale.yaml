schema_version: 2
id: wholesale
lemma: wholesale
pos:
- noun
- adjective
- adverb
ipa:
  us: /ˈhoʊlseɪl/
  uk: /ˈhəʊlseɪl/
level:
  band: target
  cefr: B2
  basis: TOEIC 700
topics:
- sales-customer-service
- shipping-logistics
speaking_use:
- respond-with-info
- express-opinion
senses:
- id: wholesale-1
  meaning_vi: Bán buôn, bán sỉ số lượng lớn với mức chiết khấu cao
  note_vi: Ngược nghĩa trực tiếp với retail (bán lẻ).
confused_words:
- word: retail
  ipa: /ˈriːteɪl/
  difference_vi: Wholesale là bán sỉ cho các đại lý; retail là bán lẻ trực tiếp tới tay người tiêu dùng.
confusing_meanings:
- difference_vi: Wholesale price là đơn giá bán sỉ; buy at wholesale nghĩa là mua với giá buôn sỉ.
collocations:
- phrase: wholesale price
  meaning_vi: giá bán buôn / bán sỉ
  evidence: corpus
- phrase: wholesale distributor
  meaning_vi: nhà phân phối bán sỉ
  evidence: corpus
- phrase: buy at wholesale
  meaning_vi: mua với giá sỉ
  evidence: corpus
synonyms:
- word: bulk selling
  meaning_vi: bán theo lô lớn
- word: volume distribution
  meaning_vi: phân phối số lượng lớn
examples:
- en: Retail stores purchase goods from the wholesale distributor at a 40% discount.
  vi: Các cửa hàng bán lẻ mua hàng hóa từ nhà phân phối bán sỉ với mức chiết khấu 40%.
pronunciation_tips_vi: Chữ 'w' câm, phát âm bắt đầu bằng âm /h/ thở nhẹ /ˈhoʊl/, âm hai là /seɪl/.
