schema_version: 3
id: utility
lemma: utility
pos:
- noun
ipa:
  us: /juːˈtɪləti/
  uk: /juːˈtɪləti/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- housing-property
senses:
- id: utility-1
  meaning_vi: Dịch vụ tiện ích thiết yếu (điện, nước, khí đốt, internet sinh hoạt); (n) tính hữu dụng
  note_vi: Thường ở dạng số nhiều (utilities) khi nhắc tới các hóa đơn sinh hoạt hàng tháng.
collocations:
- phrase: utility bills
  meaning_vi: hóa đơn tiền điện, nước sinh hoạt
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: public utility
  meaning_vi: dịch vụ tiện ích công ích công cộng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: utilities included
  meaning_vi: đã bao gồm các chi phí điện nước trong giá thuê
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: public services
  meaning_vi: dịch vụ công ích
- word: amenities
  meaning_vi: tiện ích sinh hoạt
confused_words:
- word: utilize
  ipa: /ˈjuːtəlaɪz/
  difference_vi: Utilize là động từ tận dụng; utility là danh từ dịch vụ tiện ích điện nước hoặc độ hữu dụng.
confusing_meanings:
- difference_vi: Utility bills = hóa đơn tiền điện nước; public utility = doanh nghiệp tiện ích công cộng (nhà máy nước/điện
    lực).
examples:
- en: The monthly rental fee is $1,200, with water and high-speed internet utilities included.
  vi: Mức giá thuê hàng tháng là 1.200 đô la, đã bao gồm các tiện ích nước sinh hoạt và internet tốc độ cao.
pronunciation_tips_vi: Từ có 4 âm tiết, trọng âm chính rơi vào âm thứ hai /ˈtɪl/, âm đầu là /juː/.
review:
