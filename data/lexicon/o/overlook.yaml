confused_words:
- ref: look-over
  word: look over
  ipa: /lʊk ˈoʊvər/
  meaning: Xem lướt qua, kiểm tra nhanh văn bản
  kind: spelling-sound
  difference_vi: Look over là động tác kiểm tra lướt; overlook là hướng nhìn ra cảnh
    hoặc bỏ sót sai sót
