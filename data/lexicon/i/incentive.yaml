schema_version: 3
id: incentive
lemma: incentive
pos:
- noun
ipa:
  us: /ɪnˈsentɪv/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- personnel
- general-business
- offices
senses:
- id: incentive-1
  meaning_vi: Sự khích lệ, tiền thưởng động viên (nhằm thúc đẩy năng suất/doanh số)
  note_vi: Thường dùng trong chính sách hoa hồng bán hàng hoặc phần thưởng tạo động lực cho nhân viên.
collocations:
- phrase: financial incentive
  meaning_vi: phần thưởng tài chính khích lệ
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: sales incentive
  meaning_vi: tiền thưởng thúc đẩy doanh số
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: provide an incentive
  meaning_vi: tạo động lực thúc đẩy
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: strong incentive
  meaning_vi: động lực to lớn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: motivation
  meaning_vi: động lực
- word: stimulus
  meaning_vi: chất xúc tác kích thích
confused_words:
- word: intensive
  ipa: /ɪnˈtensɪv/
  meaning: chuyên sâu, cấp tốc
  kind: spelling-sound
  difference_vi: Incentive (danh từ) là động lực khích lệ; intensive (tính từ) là mang tính chuyên sâu cao độ.
confusing_meanings:
- word: bonus
  meaning: tiền thưởng thêm
  difference_vi: Bonus là tiền thưởng trao sau khi đạt kết quả; incentive là phần thưởng hứa hẹn từ trước để kích thích nỗ
    lực.
examples:
- en: Offering performance bonuses provides a strong incentive for employees to exceed their quarterly sales targets.
  vi: Đưa ra các khoản thưởng theo hiệu suất làm việc tạo ra động lực to lớn giúp nhân viên vượt chỉ tiêu doanh số hàng quý.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /-ˈsen-/. Âm đuôi /-tɪv/ dứt khoát, tránh nhầm với tính từ 'intensive'.
review:
  status: ai_cross_checked
  checked_by:
