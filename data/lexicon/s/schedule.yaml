schema_version: 3
id: schedule
lemma: schedule
pos:
- noun
- verb
ipa:
  us: /ˈskedʒuːl/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- offices
- general-business
senses:
- id: schedule-1
  meaning_vi: Lịch trình, kế hoạch thời gian / Lên lịch, sắp xếp thời gian
  note_vi: Từ xuất hiện với tần suất cao bậc nhất trong TOEIC Speaking (lịch họp, giờ bay, thời hạn công việc).
collocations:
- phrase: ahead of schedule
  meaning_vi: trước thời hạn dự kiến
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: behind schedule
  meaning_vi: chậm hơn so với tiến độ
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: on schedule
  meaning_vi: đúng tiến độ đề ra
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: tight schedule
  meaning_vi: lịch trình dày đặc, bận rộn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: timetable
  meaning_vi: thời gian biểu
- word: agenda
  meaning_vi: chương trình nghị sự
confused_words:
- word: scheme
  ipa: /skiːm/
  meaning: kế hoạch có hệ thống, mưu đồ
  kind: spelling
  difference_vi: Schedule là thời gian biểu cụ thể; scheme mang nghĩa chương trình kế hoạch lớn hoặc mưu tính.
confusing_meanings:
- word: timetable
  meaning: bảng giờ chạy xe buýt/tàu hỏa hoặc thời khóa biểu
  difference_vi: Timetable chủ yếu dùng cho phương tiện công cộng/trường học; schedule dùng cho công việc kinh doanh và lịch
    trình cá nhân.
examples:
- en: Despite the bad weather conditions, the construction project was completed ahead of schedule.
  vi: Bất chấp điều kiện thời tiết xấu, dự án xây dựng đã được hoàn thành trước tiến độ đề ra.
pronunciation_tips_vi: Giọng Mỹ (US) phát âm là /ˈskedʒuːl/ (bắt đầu bằng âm /sk-/), trong khi giọng Anh (UK) thường đọc là
  /ˈʃedʒuːl/ (bắt đầu bằng âm /ʃ/). Trong TOEIC ưu tiên giọng US.
