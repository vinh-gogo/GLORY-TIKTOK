schema_version: 2
id: supervise
lemma: supervise
pos:
- verb
ipa:
  us: /ˈsuːpərvaɪz/
  uk: /ˈsuːpəvaɪz/
level:
  band: core
  cefr: B1
  basis: TOEIC 650
topics:
- management-operations
- human-resources
speaking_use:
- respond-to-questions
- express-opinion
senses:
- id: supervise-1
  meaning_vi: Giám sát, quản lý và theo dõi công việc của cấp dưới
  note_vi: Đảm bảo công việc được thực hiện đúng quy trình và tiêu chuẩn.
confused_words:
- word: supervisor
  ipa: /ˈsuːpərvaɪzər/
  difference_vi: Supervisor là danh từ chỉ người giám sát; supervise là động từ thực hiện việc giám sát.
confusing_meanings:
- difference_vi: Supervise là theo dõi trực tiếp hàng ngày; manage là quản lý chiến lược và tài nguyên tổng thể.
collocations:
- phrase: supervise daily operations
  meaning_vi: giám sát các hoạt động hàng ngày
  evidence: corpus
- phrase: supervise staff members
  meaning_vi: giám sát đội ngũ nhân viên
  evidence: corpus
- phrase: closely supervise
  meaning_vi: giám sát chặt chẽ
  evidence: corpus
synonyms:
- word: oversee
  meaning_vi: quan sát, giám sát
- word: monitor
  meaning_vi: theo dõi
- word: manage
  meaning_vi: quản lý
examples:
- en: The shift leader is responsible for supervising all warehouse operations.
  vi: Trưởng ca chịu trách nhiệm giám sát toàn bộ hoạt động vận hành trong kho.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈsuː/, âm cuối là /vaɪz/ với âm /z/ rung nhẹ.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary.md
  - synonyms.md
  - Oxford Learner's Dictionary
