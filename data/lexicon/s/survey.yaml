schema_version: 2
id: survey
lemma: survey
pos:
- noun
- verb
ipa:
  us: /ˈsɜːrveɪ/
  uk: /ˈsɜːveɪ/
level:
  band: core
  cefr: B1
  basis: TOEIC 650
topics:
- marketing-advertising
- management-operations
speaking_use:
- respond-to-questions
- express-opinion
senses:
- id: survey-1
  meaning_vi: Cuộc điều tra khảo sát ý kiến; (v) tiến hành khảo sát nghiên cứu
  note_vi: Công cụ lấy dữ liệu khách hàng hoặc đo lường mức độ gắn kết nhân viên.
confused_words:
- word: surveillance
  ipa: /sɜːrˈveɪləns/
  difference_vi: Surveillance là sự giám sát camera an ninh; survey là khảo sát thăm dò ý kiến.
confusing_meanings:
- difference_vi: Customer survey = khảo sát ý kiến khách hàng; land survey = đo đạc trắc địa đất đai.
collocations:
- phrase: conduct a survey
  meaning_vi: tiến hành một cuộc khảo sát ý kiến
  evidence: corpus
- phrase: survey results
  meaning_vi: kết quả khảo sát thống kê
  evidence: corpus
- phrase: customer satisfaction survey
  meaning_vi: khảo sát mức độ hài lòng của khách hàng
  evidence: corpus
synonyms:
- word: poll
  meaning_vi: thăm dò dư luận
- word: questionnaire
  meaning_vi: bảng câu hỏi khảo sát
- word: investigation
  meaning_vi: cuộc điều tra tìm hiểu
examples:
- en: According to a recent employee survey, ninety percent favored a flexible hybrid work model.
  vi: Theo một cuộc khảo sát nhân viên gần đây, chín mươi phần trăm ủng hộ mô hình làm việc kết hợp linh hoạt.
pronunciation_tips_vi: Danh từ nhấn âm 1 /ˈsɜːrveɪ/, động từ có thể nhấn âm 2 /sərˈveɪ/, âm cuối là nhị trùng âm /eɪ/.
