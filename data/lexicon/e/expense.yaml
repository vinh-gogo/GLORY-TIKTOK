schema_version: 3
id: expense
lemma: expense
pos:
- noun
ipa:
  us: /ɪkˈspens/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- finance-budgeting
- general-business
- travel
senses:
- id: expense-1
  meaning_vi: Chi phí, khoản tiền chi tiêu (công tác, vận hành)
  note_vi: Thường gặp trong bối cảnh thanh toán công tác phí, báo cáo chi tiêu tài chính.
collocations:
- phrase: travel expenses
  meaning_vi: chi phí đi lại, công tác phí
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: reduce expenses
  meaning_vi: cắt giảm chi phí chi tiêu
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: at the company's expense
  meaning_vi: do công ty chi trả toàn bộ
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: expense report
  meaning_vi: bảng báo cáo chi phí
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: expenditure
  meaning_vi: khoản chi tiêu
- word: cost
  meaning_vi: chi phí
confused_words:
- word: expanse
  ipa: /ɪkˈspæns/
  meaning: dải đất rộng bao la
  kind: spelling-sound
  difference_vi: Expense có nguyên âm /e/ mang nghĩa chi phí; expanse có nguyên âm /æ/ mang nghĩa không gian bao la rộng lớn.
confusing_meanings:
- word: price
  meaning: giá bán niêm yết của hàng hóa
  difference_vi: Price là mức giá đề ra cho sản phẩm; expense là số tiền thực tế bạn đã phải chi trả trong quá trình sinh
    hoạt hoặc làm việc.
examples:
- en: Employees must submit all receipts along with their travel expense report by Friday afternoon.
  vi: Nhân viên phải nộp tất cả các hóa đơn kèm theo báo cáo công tác phí trước chiều thứ Sáu.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /-ˈspens/. Âm cuối là /s/ xì nhẹ rõ ràng, tránh đọc nhầm thành âm
  đuôi 'x'.
review:
