senses:
- id: estate-1
  meaning_vi: Bất động sản, khu đất xây dựng; toàn bộ tài sản thừa kế của một người
  note_vi: 'Collocation cực kỳ quan trọng: real estate (ngành bất động sản), real estate agent (nhà môi giới nhà đất).'
collocations:
- phrase: real estate agent
  meaning_vi: môi giới viên bất động sản
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: real estate market
  meaning_vi: thị trường bất động sản
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: industrial estate
  meaning_vi: khu đất công nghiệp
