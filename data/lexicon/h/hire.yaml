schema_version: 3
id: hire
lemma: hire
pos:
- verb
- noun
ipa:
  us: /ˈhaɪər/
  uk: /ˈhaɪə/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- personnel
senses:
- id: hire-1
  meaning_vi: Tuyển dụng nhân viên mới; thuê thiết bị ngắn hạn
  note_vi: Trong tiếng Anh-Mỹ, hire chủ yếu dùng cho tuyển dụng nhân sự (đồng nghĩa với employ).
collocations:
- phrase: hire qualified staff
  meaning_vi: tuyển dụng nhân viên đủ tiêu chuẩn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: new hire
  meaning_vi: nhân viên mới được tuyển
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: freeze on hiring
  meaning_vi: đóng băng việc tuyển dụng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: employ
  meaning_vi: thuê nhân công, tuyển dụng
- word: recruit
  meaning_vi: chiêu mộ, tuyển quân
confused_words:
- word: fire
  ipa: /ˈfaɪər/
  difference_vi: Fire là sa thải (ngược nghĩa hoàn toàn với hire là tuyển dụng).
confusing_meanings:
- difference_vi: Hire nhân sự (dài hạn trong US) khác với rent đồ vật (thuê trả tiền theo ngày/tháng).
examples:
- en: The firm plans to hire ten software developers next quarter to support product expansion.
  vi: Công ty dự định tuyển mười lập trình viên phần mềm vào quý tới để hỗ trợ việc mở rộng sản phẩm.
pronunciation_tips_vi: Phát âm /haɪər/ có âm họng nhẹ ở đầu và nhị trùng âm /aɪ/ kết hợp âm lướt nhẹ /ər/.
