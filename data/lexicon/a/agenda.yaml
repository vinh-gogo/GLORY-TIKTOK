schema_version: 2
id: agenda
lemma: agenda
pos:
- noun
ipa:
  us: /əˈdʒendə/
level:
  cefr: B1
  band: core
  basis: editorial
topics:
- work
speaking_use:
- respond-to-questions
senses:
- id: agenda-1
  meaning_vi: Chương trình nghị sự, danh sách các đề mục cần thảo luận trong cuộc
    họp
confused_words:
- ref: agency
  word: agency
  ipa: /ˈeɪdʒənsi/
  meaning: Đại lý, cơ quan đại diện hoặc công ty truyền thông
  kind: spelling-sound
  difference_vi: Tránh nhầm âm đuôi -da /ˈdʒendə/ và -cy /ˈeɪdʒənsi/
confusing_meanings:
- ref: schedule
  word: schedule
  meaning: Lịch trình thời gian chi tiết (theo giờ, phút)
  difference_vi: Agenda là danh sách các chủ đề thảo luận; schedule là mốc thời gian
    cụ thể
collocations:
- phrase: on the agenda
  meaning_vi: Có tên trong nội dung cuộc họp
  evidence: corpus
- phrase: set the agenda
  meaning_vi: Thiết lập các nội dung cần bàn thảo
  evidence: corpus
- phrase: stick to the agenda
  meaning_vi: Bám sát theo các mục đã định sẵn
  evidence: corpus
synonyms:
- word: meeting plan
  meaning_vi: kế hoạch cuộc họp
examples:
- en: The first item on our agenda today is reviewing quarterly sales performance.
  vi: Nội dung đầu tiên trong chương trình nghị sự hôm nay là đánh giá kết quả doanh
    số theo quý.
