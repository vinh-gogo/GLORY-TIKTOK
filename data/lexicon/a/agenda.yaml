    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: set the agenda
  meaning_vi: Thiết lập các nội dung cần bàn thảo
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: stick to the agenda
  meaning_vi: Bám sát theo các mục đã định sẵn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: meeting plan
  meaning_vi: kế hoạch cuộc họp
confused_words:
- ref: agency
  word: agency
  ipa: /ˈeɪdʒənsi/
  meaning: Đại lý, cơ quan đại diện hoặc công ty truyền thông
  kind: spelling-sound
  difference_vi: Tránh nhầm âm đuôi -da /ˈdʒendə/ và -cy /ˈeɪdʒənsi/
confusing_meanings:
- ref: schedule
  word: schedule
  meaning: Lịch trình thời gian chi tiết (theo giờ, phút)
  difference_vi: Agenda là danh sách các chủ đề thảo luận; schedule là mốc thời gian cụ thể
examples:
- en: The first item on our agenda today is reviewing quarterly sales performance.
  vi: Nội dung đầu tiên trong chương trình nghị sự hôm nay là đánh giá kết quả doanh số theo quý.
