schema_version: 3
id: authorize
lemma: authorize
pos:
- verb
ipa:
  us: /ˈɔːθəraɪz/
  uk: /ˈɔːθəraɪz/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
- offices
senses:
- id: authorize-1
  meaning_vi: Cấp phép chính thức, ủy quyền hoặc phê duyệt quyền hạn cho ai làm gì
  note_vi: Hành động cho phép bằng văn bản hoặc mật khẩu hệ thống.
collocations:
- phrase: authorized personnel only
  meaning_vi: chỉ nhân sự được cấp phép mới được vào
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: authorize payment
  meaning_vi: phê duyệt lệnh thanh toán
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: officially authorize
  meaning_vi: chính thức cấp quyền cho phép
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: approve
  meaning_vi: phê chuẩn
- word: sanction
  meaning_vi: cho phép chính thức
- word: empower
  meaning_vi: trao quyền
confused_words:
- word: authority
  ipa: /əˈθɔːrəti/
  difference_vi: Authority là danh từ thẩm quyền hoặc nhà chức trách; authorize là động từ cấp quyền, phê duyệt.
confusing_meanings:
- difference_vi: Authorized personnel only = chỉ dành riêng cho nhân viên có thẩm quyền; authorize expenditure = phê duyệt
    khoản chi tiêu.
examples:
- en: Only the chief financial officer is authorized to approve capital expenditures exceeding $10,000.
  vi: Chỉ giám đốc tài chính mới có thẩm quyền phê duyệt các khoản chi đầu tư vượt quá 10.000 đô la.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈɔːθ/, âm /θ/ cắn nhẹ đầu lưỡi thổi hơi, âm đuôi /raɪz/ kết thúc bằng âm rung
  /z/.
review:
