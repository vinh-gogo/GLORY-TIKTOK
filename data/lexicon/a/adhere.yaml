schema_version: 3
id: adhere
lemma: adhere
pos:
- verb
ipa:
  us: /ədˈhɪr/
  uk: /ədˈhɪə/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
- offices
senses:
- id: adhere-1
  meaning_vi: Bám sát, tuân thủ nghiêm ngặt nguyên tắc, lịch trình hoặc chính sách đề ra
  note_vi: 'Đi kèm giới từ to: adhere to guidelines / policies / schedule.'
- id: adhere-2
  meaning_vi: Dính chặt vào bề mặt (vật lý)
  note_vi: Như chất keo dán (adhesive).
collocations:
- phrase: adhere to guidelines
  meaning_vi: bám sát các chỉ dẫn quy chế
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: adhere to the schedule
  meaning_vi: tuân thủ đúng lịch trình đã định
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: strictly adhere
  meaning_vi: tuân thủ một cách nghiêm ngặt
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: stick to
  meaning_vi: bám lấy, không rời
- word: follow
  meaning_vi: làm theo
- word: observe
  meaning_vi: tuân thủ chấp hành
confused_words:
- word: adhesion
  ipa: /ədˈhiːʒn/
  difference_vi: Adhesion là độ bám dính vật lý; adhere là động từ tuân thủ bám sát.
confusing_meanings:
- difference_vi: Adhere to the policy = tuân thủ chính sách; adhere to the surface = dính chặt vào bề mặt.
examples:
- en: Staff members are required to strictly adhere to the company dress code policy.
  vi: Nhân viên bắt buộc phải tuân thủ nghiêm ngặt chính sách về trang phục của công ty.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /hɪr/, âm /h/ thở rõ ràng trước nguyên âm đôi /ɪr/.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary-md
  - synonyms-md
  - oxford-ref
