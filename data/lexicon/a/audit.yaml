schema_version: 2
id: audit
lemma: audit
pos:
- noun
- verb
ipa:
  us: /ˈɔːdɪt/
  uk: /ˈɔːdɪt/
level:
  band: target
  cefr: B2
  basis: TOEIC 700
topics:
- finance-accounting
- legal-compliance
speaking_use:
- respond-with-info
- express-opinion
senses:
- id: audit-1
  meaning_vi: Sự kiểm toán, cuộc kiểm tra sổ sách kế toán chính thức; (v) kiểm toán
  note_vi: Thẩm tra độ chính xác và tính minh bạch của các báo cáo tài chính.
confused_words:
- word: audio
  ipa: /ˈɔːdioʊ/
  difference_vi: Audio là âm thanh; audit là kiểm toán tài chính sổ sách.
confusing_meanings:
- difference_vi: Financial audit là kiểm toán tài chính; quality audit là kiểm tra quy trình chất lượng ISO.
collocations:
- phrase: conduct an internal audit
  meaning_vi: tiến hành kiểm toán nội bộ
  evidence: corpus
- phrase: annual financial audit
  meaning_vi: cuộc kiểm toán tài chính thường niên
  evidence: corpus
- phrase: audit the company books
  meaning_vi: kiểm toán sổ sách công ty
  evidence: corpus
synonyms:
- word: inspect
  meaning_vi: thanh tra
- word: examine
  meaning_vi: kiểm tra kỹ lưỡng
- word: review
  meaning_vi: rà soát lại
examples:
- en: An independent auditing firm was hired to verify the accuracy of the financial statements.
  vi: Một công ty kiểm toán độc lập đã được thuê để xác thực độ chính xác của các báo cáo tài chính.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈɔː/, nguyên âm /ɔː/ tròn môi mở vừa phải, âm đuôi /dɪt/ dứt khoát.
