schema_version: 2
id: vacancy
lemma: vacancy
pos:
- noun
ipa:
  us: /ˈveɪkənsi/
level:
  cefr: B1
  band: core
  basis: editorial
topics:
- hiring
- hotels
- work
speaking_use:
- read-aloud
- respond-with-info
- respond-to-questions
senses:
- id: vacancy-1
  meaning_vi: Vị trí tuyển dụng còn trống / Phòng khách sạn còn trống
  note_vi: Gặp rất nhiều trong thông báo tuyển dụng và bảng thông báo khách sạn (Part
    1, Part 4).
collocations:
- phrase: job vacancy
  meaning_vi: vị trí công việc còn trống
  evidence: corpus
- phrase: fill a vacancy
  meaning_vi: tuyển người lấp vào vị trí trống
  evidence: corpus
- phrase: no vacancies
  meaning_vi: biển báo hết chỗ / hết phòng trống
  evidence: corpus
- phrase: current vacancy
  meaning_vi: vị trí đang tuyển dụng hiện tại
  evidence: corpus
confused_words:
- word: vacation
  ipa: /veɪˈkeɪʃn/
  meaning: kỳ nghỉ lễ, chuyến du lịch
  kind: spelling-sound
  difference_vi: Vacancy có đuôi /-kənsi/ chỉ chỗ trống/vị trí tuyển dụng; vacation
    có đuôi /-keɪʃn/ chỉ kỳ nghỉ.
confusing_meanings:
- word: opening
  meaning: cơ hội việc làm đang mở
  difference_vi: Cả hai từ tương đồng, tuy nhiên vacancy trang trọng hơn và thường
    dùng trong văn bản thông báo chính thức.
synonyms:
- word: opening
  meaning_vi: vị trí mở
- word: available position
  meaning_vi: vị trí đang có sẵn
examples:
- en: The marketing department announced an immediate job vacancy for an experienced
    digital copywriter.
  vi: Phòng tiếp thị đã thông báo một vị trí việc làm tuyển gấp cho một chuyên viên
    viết nội dung số giàu kinh nghiệm.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈveɪ-/. Âm giữa là schwa /-kən-/,
  kết thúc bằng /-si/ nhẹ nhàng.
review:
