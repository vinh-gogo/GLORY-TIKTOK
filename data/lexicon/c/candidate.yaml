schema_version: 3
id: candidate
lemma: candidate
pos:
- noun
ipa:
  us: /ˈkændɪdət/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- personnel
- offices
senses:
- id: candidate-1
  meaning_vi: Ứng viên sáng giá (đã được chọn vào danh sách phỏng vấn)
  note_vi: Chủ đề tuyển dụng và phỏng vấn việc làm.
collocations:
- phrase: ideal candidate
  meaning_vi: ứng viên lý tưởng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: qualified candidate
  meaning_vi: ứng viên đủ tiêu chuẩn năng lực
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: prospective candidate
  meaning_vi: ứng viên tiềm năng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: shortlist candidates
  meaning_vi: chọn lọc ứng viên vào danh sách rút gọn
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: applicant
  meaning_vi: người xin việc
- word: nominee
  meaning_vi: người được đề cử
confused_words:
- word: candid
  ipa: /ˈkændɪd/
  meaning: thẳng thắn, bộc trực
  kind: spelling-sound
  difference_vi: Candidate là danh từ chỉ ứng viên; candid là tính từ mang nghĩa thành thật, bộc trực.
confusing_meanings:
- word: applicant
  meaning: người mới nộp hồ sơ bước đầu
  difference_vi: Applicant là người nộp đơn đăng ký ban đầu; candidate là người đã qua sàng lọc để vào vòng tuyển chọn chính
    thức.
examples:
- en: She is considered the most qualified candidate for the senior project manager vacancy.
  vi: Cô ấy được đánh giá là ứng viên đủ tiêu chuẩn nhất cho vị trí trưởng nhóm quản lý dự án còn trống.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈkæn/. Âm đuôi là schwa /-dət/ ngắn gọn, bật nhẹ âm /t/ cuối.
