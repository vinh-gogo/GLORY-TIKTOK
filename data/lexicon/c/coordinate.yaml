schema_version: 3
id: coordinate
lemma: coordinate
pos:
- verb
ipa:
  us: /koʊˈɔːrdɪneɪt/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- offices
- general-business
senses:
- id: coordinate-1
  meaning_vi: Điều phối, phối hợp nhịp nhàng các hoạt động/lịch trình
  note_vi: Rất hay gặp khi nói về công việc của điều phối viên dự án hoặc tổ chức sự kiện.
collocations:
- phrase: coordinate efforts
  meaning_vi: phối hợp các nỗ lực
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: coordinate the schedule
  meaning_vi: điều phối lịch trình công tác
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: project coordinator
  meaning_vi: điều phối viên dự án
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: coordinate with other departments
  meaning_vi: phối hợp cùng các phòng ban khác
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: organize
  meaning_vi: tổ chức sắp xếp
- word: synchronize
  meaning_vi: đồng bộ hóa
confused_words:
- word: subordinate
  ipa: /səˈbɔːrdɪnət/
  meaning: cấp dưới, phụ thuộc
  kind: spelling-sound
  difference_vi: Coordinate là điều phối công việc; subordinate là nhân viên cấp dưới trực tiếp.
confusing_meanings:
- word: manage
  meaning: quản lý chỉ đạo
  difference_vi: Manage là điều hành ra chỉ thị; coordinate là kết nối và sắp xếp các mắt xích làm việc ăn ý với nhau.
examples:
- en: The project coordinator will ensure all marketing materials are delivered before the conference starts.
  vi: Điều phối viên dự án sẽ đảm bảo tất cả tài liệu tiếp thị được chuyển đến trước khi hội nghị bắt đầu.
pronunciation_tips_vi: Khi là động từ, phát âm âm đuôi là /-neɪt/ có trọng âm phụ. Âm đầu là /koʊ-/, âm tiết hai /-ˈɔːr-/
  nhận trọng âm chính.
review:
