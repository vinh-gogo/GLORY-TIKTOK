schema_version: 3
id: cargo
lemma: cargo
pos:
- noun
ipa:
  us: /ˈkɑːrɡoʊ/
  uk: /ˈkɑːɡəʊ/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- purchasing
senses:
- id: cargo-1
  meaning_vi: Hàng hóa chuyên chở trên tàu thủy, máy bay hoặc xe tải lớn
  note_vi: Thường thấy trong ảnh Part 2 chụp container tại bến cảng (cargo container, cargo ship).
collocations:
- phrase: cargo ship
  meaning_vi: tàu chở hàng hóa
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: load cargo
  meaning_vi: bốc dỡ / xếp hàng hóa lên phương tiện
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: cargo container
  meaning_vi: thùng công-ten-nơ chứa hàng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: freight
  meaning_vi: hàng hóa chuyên chở
- word: load
  meaning_vi: tải trọng hàng
confused_words:
- word: freight
  ipa: /freɪt/
  difference_vi: Cargo và freight đồng nghĩa, tuy nhiên cargo thường chỉ các kiện hàng vật lý trên tàu/máy bay, freight bao
    gồm cả dịch vụ và cước phí.
confusing_meanings:
- difference_vi: Cargo ship = tàu chở hàng; cargo hold = khoang chứa hàng của máy bay hoặc tàu thủy.
examples:
- en: Dock workers used giant cranes to unload heavy cargo containers from the vessel.
  vi: Công nhân cảng đã dùng cần cẩu khổng lồ để dỡ các thùng container chở hàng nặng từ con tàu.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈkɑːr/, uốn lưỡi âm /r/, âm thứ hai là /ɡoʊ/.
