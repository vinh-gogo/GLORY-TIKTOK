schema_version: 2
id: cancel
lemma: cancel
pos:
- verb
ipa:
  us: /ˈkænsl/
level:
  cefr: B1
  band: core
  basis: editorial
topics:
- travel
- meetings
- shopping
speaking_use:
- read-aloud
- respond-with-info
- respond-to-questions
senses:
- id: cancel-1
  meaning_vi: Hủy bỏ (cuộc hẹn, chuyến bay, đơn đặt hàng)
  note_vi: Xuất hiện khắp các đề thi khi có sự cố lịch trình hoặc hủy bỏ đơn mua hàng.
collocations:
- phrase: cancel a reservation
  meaning_vi: hủy chỗ đã đặt trước
  evidence: corpus
- phrase: cancel an order
  meaning_vi: hủy một đơn hàng
  evidence: corpus
- phrase: cancel due to weather
  meaning_vi: hủy lịch do điều kiện thời tiết
  evidence: corpus
- phrase: free cancellation
  meaning_vi: hủy đặt chỗ miễn phí
  evidence: corpus
confused_words:
- word: conceal
  ipa: /kənˈsiːl/
  meaning: che giấu, giấu giếm
  kind: spelling-sound
  difference_vi: Cancel là hủy bỏ kế hoạch; conceal mang nghĩa giấu giếm điều gì đó.
confusing_meanings:
- word: postpone
  meaning: tạm hoãn dời ngày
  difference_vi: Postpone là dời cuộc hẹn sang ngày khác; cancel là hủy bỏ hoàn toàn
    sự kiện.
synonyms:
- word: call off
  meaning_vi: bãi bỏ
- word: abort
  meaning_vi: hủy ngang
examples:
- en: The airline had to cancel all afternoon departures because of dense fog covering
    the runway.
  vi: Hãng hàng không đã phải hủy tất cả các chuyến bay khởi hành vào buổi chiều vì
    sương mù dày đặc bao phủ đường băng.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈkæn-/. Âm đuôi /-sl/ đọc liền
  mượt mà, không thêm 'ờ'.
review:
  status: ai_cross_checked
  checked_by:
