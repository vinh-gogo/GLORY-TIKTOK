schema_version: 3
id: cancel
lemma: cancel
pos:
- verb
ipa:
  us: /ˈkænsl/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- travel
- offices
- purchasing
senses:
- id: cancel-1
  meaning_vi: Hủy bỏ (cuộc hẹn, chuyến bay, đơn đặt hàng)
  note_vi: Xuất hiện khắp các đề thi khi có sự cố lịch trình hoặc hủy bỏ đơn mua hàng.
collocations:
- phrase: cancel a reservation
  meaning_vi: hủy chỗ đã đặt trước
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: cancel an order
  meaning_vi: hủy một đơn hàng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: cancel due to weather
  meaning_vi: hủy lịch do điều kiện thời tiết
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: free cancellation
  meaning_vi: hủy đặt chỗ miễn phí
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: call off
  meaning_vi: bãi bỏ
- word: abort
  meaning_vi: hủy ngang
confused_words:
- word: conceal
  ipa: /kənˈsiːl/
  meaning: che giấu, giấu giếm
  kind: spelling-sound
  difference_vi: Cancel là hủy bỏ kế hoạch; conceal mang nghĩa giấu giếm điều gì đó.
confusing_meanings:
- word: postpone
  meaning: tạm hoãn dời ngày
  difference_vi: Postpone là dời cuộc hẹn sang ngày khác; cancel là hủy bỏ hoàn toàn sự kiện.
examples:
- en: The airline had to cancel all afternoon departures because of dense fog covering the runway.
  vi: Hãng hàng không đã phải hủy tất cả các chuyến bay khởi hành vào buổi chiều vì sương mù dày đặc bao phủ đường băng.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈkæn-/. Âm đuôi /-sl/ đọc liền mượt mà, không thêm 'ờ'.
