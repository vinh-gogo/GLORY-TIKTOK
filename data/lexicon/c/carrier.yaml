schema_version: 3
id: carrier
lemma: carrier
pos:
- noun
ipa:
  us: /ˈkæriər/
  uk: /ˈkæriə/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- purchasing
senses:
- id: carrier-1
  meaning_vi: Hãng vận chuyển, công ty vận tải chuyên chở hàng hóa hoặc hành khách
  note_vi: Bao gồm các hãng hàng không (air carrier), đội xe tải hoặc hãng tàu biển.
collocations:
- phrase: shipping carrier
  meaning_vi: hãng vận tải giao nhận hàng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: common carrier
  meaning_vi: đơn vị vận tải công cộng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: reliable carrier
  meaning_vi: đơn vị vận chuyển đáng tin cậy
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: transporter
  meaning_vi: nhà vận tải
- word: shipper
  meaning_vi: chủ hãng tàu/giao hàng
confused_words:
- word: courier
  ipa: /ˈkʊriər/
  difference_vi: Courier là nhân viên chuyển phát nhanh thư từ/bưu phẩm nhỏ; carrier là doanh nghiệp/hãng chuyên chở hàng
    quy mô lớn.
confusing_meanings:
- difference_vi: Common carrier = hãng vận tải công cộng theo biểu giá công khai; mail carrier = nhân viên bưu tá giao thư.
examples:
- en: We partner with several reputable shipping carriers to guarantee swift international delivery.
  vi: Chúng tôi hợp tác với nhiều hãng vận chuyển uy tín để đảm bảo việc giao hàng quốc tế nhanh chóng.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈkæ/, nguyên âm /æ/ bẹt miệng mở rộng.
