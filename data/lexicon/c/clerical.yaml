schema_version: 3
id: clerical
lemma: clerical
pos:
- adjective
ipa:
  us: /ˈklerɪkl/
  uk: /ˈklerɪkl/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- offices
- personnel
senses:
- id: clerical-1
  meaning_vi: Thuộc công việc bàn giấy, văn thư hành chính tổng hợp
  note_vi: Bao gồm soạn thảo, lưu trữ hồ sơ, nhập liệu và trực điện thoại văn phòng.
collocations:
- phrase: clerical error
  meaning_vi: sai sót trong quá trình đánh máy / ghi chép sổ sách
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: clerical duties
  meaning_vi: các nhiệm vụ hành chính bàn giấy
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: clerical staff
  meaning_vi: đội ngũ nhân viên văn thư
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: administrative
  meaning_vi: thuộc về hành chính
- word: secretarial
  meaning_vi: thuộc công việc thư ký
confused_words:
- word: clerk
  ipa: /klɜːrk/
  difference_vi: Clerk là nhân viên văn thư hoặc nhân viên thu ngân; clerical là tính từ thuộc về công việc văn phòng hành
    chính.
confusing_meanings:
- difference_vi: Clerical error = sai sót do sơ suất đánh máy/ghi chép sổ sách; clerical duties = nghiệp vụ hành chính.
examples:
- en: The wrong invoice total was simply due to an unintended clerical error during data entry.
  vi: Tổng số tiền trên hóa đơn bị sai chỉ đơn giản là do lỗi đánh máy vô ý trong quá trình nhập dữ liệu.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈkler/, nguyên âm /e/ mở tự nhiên, âm cuối là /ɪkl/.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
