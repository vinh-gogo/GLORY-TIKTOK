schema_version: 3
id: compromise
lemma: compromise
pos:
- noun
- verb
ipa:
  us: /ˈkɑːmprəmaɪz/
  uk: /ˈkɒmprəmaɪz/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
- offices
senses:
- id: compromise-1
  meaning_vi: Sự thỏa hiệp, nhân nhượng lẫn nhau; (v) đi đến thỏa hiệp
  note_vi: Giải pháp dung hòa khi hai bên có ý kiến hoặc lợi ích khác nhau.
- id: compromise-2
  meaning_vi: Làm tổn hại, gây nguy hiểm hoặc làm suy giảm chất lượng/an toàn
  note_vi: 'Thường gặp: compromise on quality (hạ chuẩn chất lượng), compromise system security.'
collocations:
- phrase: reach a compromise
  meaning_vi: đạt được sự thỏa hiệp
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: compromise on quality
  meaning_vi: hạ thấp / nhân nhượng về mặt chất lượng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: acceptable compromise
  meaning_vi: sự thỏa hiệp có thể chấp nhận được
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: settlement
  meaning_vi: sự dàn xếp thỏa thuận
- word: concession
  meaning_vi: sự nhượng bộ
confused_words:
- word: compose
  ipa: /kəmˈpoʊz/
  difference_vi: Compose nghĩa là sáng tác, tạo thành; còn compromise là thỏa hiệp hoặc làm tổn hại.
confusing_meanings:
- difference_vi: Compromise mang nghĩa tích cực là 'đạt được thỏa hiệp', nhưng mang nghĩa tiêu cực là 'làm giảm sút uy tín/chất
    lượng'.
examples:
- en: Both negotiating teams made concessions to reach an acceptable compromise.
  vi: Cả hai đội đàm phán đều đưa ra nhượng bộ để đạt được sự thỏa hiệp chấp nhận được.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈkɑːm/, đuôi âm là /aɪz/ với âm /z/ rung rõ.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary-md
  - synonyms-md
  - oxford-ref
