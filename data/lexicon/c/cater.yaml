schema_version: 3
id: cater
lemma: cater
pos:
- verb
ipa:
  us: /ˈkeɪtər/
  uk: /ˈkeɪtə/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- travel
senses:
- id: cater-1
  meaning_vi: Cung cấp dịch vụ nấu cỗ và đồ ăn thức uống cho các sự kiện
  note_vi: Thường đi kèm với catering service (dịch vụ nấu tiệc lưu động).
- id: cater-2
  meaning_vi: Đáp ứng, phục vụ theo nhu cầu hoặc thị hiếu riêng biệt (cater to)
  note_vi: 'Cấu trúc: cater to the needs of...'
collocations:
- phrase: cater a wedding reception
  meaning_vi: phục vụ tiệc cưới
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: cater to customer needs
  meaning_vi: đáp ứng các nhu cầu của khách hàng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: outside catering service
  meaning_vi: dịch vụ đặt tiệc nấu từ bên ngoài
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: provide food
  meaning_vi: cung cấp đồ ăn
- word: serve
  meaning_vi: phục vụ
- word: accommodate
  meaning_vi: đáp ứng thị hiếu
confused_words:
- word: caterpillar
  ipa: /ˈkætərpɪlər/
  difference_vi: Caterpillar là con sâu bướm; cater là cung cấp dịch vụ ẩm thực hoặc phục vụ thị hiếu.
confusing_meanings:
- difference_vi: Cater a party = nấu tiệc cho bữa tiệc; cater to tourists = chuyên phục vụ đối tượng du khách.
examples:
- en: A prestigious local restaurant was hired to cater the corporate anniversary dinner.
  vi: Một nhà hàng địa phương danh tiếng đã được thuê để phục vụ tiệc tối kỷ niệm thành lập công ty.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết đầu /ˈkeɪ/, nhị trùng âm /eɪ/ rõ nét, âm cuối lướt /tər/.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary-md
  - synonyms-md
  - oxford-ref
