schema_version: 2
id: complimentary
lemma: complimentary
pos:
- adjective
ipa:
  us: /ˌkɑːmplɪˈmentri/
  uk: /ˌkɒmplɪˈmentri/
level:
  band: target
  cefr: B2
  basis: TOEIC 700
topics:
- sales-customer-service
- hospitality-travel
speaking_use:
- respond-with-info
- respond-to-questions
senses:
- id: complimentary-1
  meaning_vi: Miễn phí, được tặng kèm như một dịch vụ ưu đãi
  note_vi: Rất hay gặp trong nhà hàng, khách sạn và các chuyến bay (complimentary breakfast/beverage).
confused_words:
- word: complementary
  ipa: /ˌkɑːmplɪˈmentri/
  difference_vi: 'Đồng âm hoàn toàn nhưng khác nghĩa: complementary (có chữ ''e'') là bổ sung tương hỗ cho nhau; complimentary
    (có chữ ''i'') là miễn phí hoặc khen ngợi.'
confusing_meanings:
- difference_vi: Complimentary breakfast = bữa sáng miễn phí kèm phòng; complimentary remarks = lời ngợi khen tán dương.
collocations:
- phrase: complimentary breakfast
  meaning_vi: bữa ăn sáng miễn phí
  evidence: corpus
- phrase: complimentary ticket
  meaning_vi: vé mời xem miễn phí
  evidence: corpus
- phrase: complimentary shuttle service
  meaning_vi: dịch vụ xe đưa đón miễn phí
  evidence: corpus
synonyms:
- word: free of charge
  meaning_vi: miễn phí hoàn toàn
- word: courtesy
  meaning_vi: mang tính đãi ngộ lịch thiệp
examples:
- en: Hotel guests can enjoy complimentary Wi-Fi and access to the fitness center during their stay.
  vi: Khách lưu trú tại khách sạn được sử dụng Wi-Fi miễn phí và vào trung tâm thể hình trong suốt kỳ nghỉ.
pronunciation_tips_vi: Trọng âm chính rơi vào âm thứ ba /ˈmen/, đọc là /ˌkɑːmplɪˈmentri/ lướt âm cuối.
