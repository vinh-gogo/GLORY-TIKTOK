senses:
- id: baggage-1
  meaning_vi: Hành lý, va li túi xách mang theo của hành khách
  note_vi: Danh từ không đếm được (uncountable noun), dùng baggage claim (khu lấy hành lý sân bay).
collocations:
- phrase: excess baggage fee
  meaning_vi: phí hành lý quá cước
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: baggage claim area
  meaning_vi: khu vực trả lại hành lý tại sân bay
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: carry-on baggage
  meaning_vi: hành lý xách tay
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: luggage
  meaning_vi: hành lý
- word: suitcases
  meaning_vi: va li đồ đạc
confused_words:
- word: luggage
  ipa: /ˈlʌɡɪdʒ/
  difference_vi: Baggage và luggage đồng nghĩa hoàn toàn; luggage phổ biến hơn trong tiếng Anh-Anh, baggage phổ biến trong
    tiếng Anh-Mỹ.
confusing_meanings:
- difference_vi: Carry-on baggage = hành lý xách tay lên máy bay; checked baggage = hành lý ký gửi dưới khoang hàng.
examples:
- en: Passengers can proceed to Carousel 4 in the baggage claim area to collect their luggage.
  vi: Hành khách có thể di chuyển đến băng chuyền số 4 tại khu vực nhận hành lý để lấy đồ đạc của mình.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈbæɡ/, âm đuôi là /ɪdʒ/ rung cổ họng rõ ràng.
