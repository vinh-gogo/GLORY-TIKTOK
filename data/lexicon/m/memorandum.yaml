schema_version: 3
id: memorandum
lemma: memorandum
pos:
- noun
ipa:
  us: /ˌmeməˈrændəm/
  uk: /ˌmeməˈrændəm/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- offices
- general-business
senses:
- id: memorandum-1
  meaning_vi: Bản ghi nhớ nội bộ công ty (thường viết tắt là memo); văn bản thỏa thuận sơ bộ
  note_vi: Văn bản trao đổi công vụ nội bộ nhằm thông báo chính sách mới hoặc chỉ thị quan trọng.
collocations:
- phrase: internal memorandum
  meaning_vi: bản ghi nhớ lưu hành nội bộ
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: memorandum of understanding
  meaning_vi: biên bản ghi nhớ hợp tác (MOU)
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: issue a memorandum
  meaning_vi: ban hành một bản ghi nhớ chỉ thị
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: memo
  meaning_vi: thông báo vắn tắt nội bộ
- word: notice
  meaning_vi: thông tri
- word: circular
  meaning_vi: công văn gửi thông báo
confused_words:
- word: memorial
  ipa: /məˈmɔːriəl/
  difference_vi: Memorial là đài tưởng niệm; memorandum là bản thông báo ghi nhớ nội bộ.
confusing_meanings:
- difference_vi: Internal memo = thông báo lưu hành nội bộ; memorandum of understanding (MOU) = biên bản ghi nhớ hợp tác chiến
    lược giữa hai đơn vị.
examples:
- en: Management sent an internal memorandum reminding all staff to wear visitor badges at all times.
  vi: Ban quản lý đã gửi một bản ghi nhớ nội bộ nhắc nhở toàn thể nhân viên phải đeo thẻ khách mọi lúc.
pronunciation_tips_vi: Từ có 4 âm tiết, trọng âm chính rơi vào âm thứ ba /ˈræn/, âm cuối đọc là /dəm/ nhẹ.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary-md
  - synonyms-md
  - oxford-ref
