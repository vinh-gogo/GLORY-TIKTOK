schema_version: 3
id: malfunction
lemma: malfunction
pos:
- noun
- verb
ipa:
  us: /ˌmælˈfʌŋkʃn/
  uk: /ˌmælˈfʌŋkʃn/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- manufacturing
- offices
senses:
- id: malfunction-1
  meaning_vi: Sự cố trục trặc kỹ thuật, máy móc hỏng hóc không hoạt động; (v) bị lỗi vận hành
  note_vi: Tiền tố mal- (xấu/sai) kết hợp với function (chức năng).
collocations:
- phrase: equipment malfunction
  meaning_vi: trục trặc thiết bị máy móc
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: mechanical malfunction
  meaning_vi: sự cố cơ khí
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: malfunction suddenly
  meaning_vi: đột ngột bị hỏng hóc
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: glitch
  meaning_vi: sự cố nhỏ bất ngờ
- word: breakdown
  meaning_vi: sự đổ vỡ, hỏng máy móc
confused_words:
- word: function
  ipa: /ˈfʌŋkʃn/
  difference_vi: Function là chức năng hoạt động bình thường; malfunction là sự trục trặc, lỗi vận hành.
confusing_meanings:
- difference_vi: Equipment malfunction = sự cố máy móc hỏng; software malfunction = lỗi phần mềm gián đoạn.
examples:
- en: Production was temporarily halted due to an unexpected equipment malfunction in the packaging unit.
  vi: Việc sản xuất đã tạm thời bị ngừng lại do sự cố trục trặc thiết bị bất ngờ tại bộ phận đóng gói.
pronunciation_tips_vi: Trọng âm rơi vào âm thứ hai /ˈfʌŋk/, có âm ngắt /ŋk/ trước khi sang /ʃn/.
