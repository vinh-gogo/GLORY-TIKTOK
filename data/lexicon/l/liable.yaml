schema_version: 3
id: liable
lemma: liable
pos:
- adjective
ipa:
  us: /ˈlaɪəbl/
  uk: /ˈlaɪəbl/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
senses:
- id: liable-1
  meaning_vi: Có trách nhiệm pháp lý phải bồi thường thiệt hại (legally liable)
  note_vi: 'Cấu trúc: be held liable for damage / be liable to pay.'
- id: liable-2
  meaning_vi: Có khả năng dễ bị, có xu hướng xảy ra điều không tốt (liable to do sth)
  note_vi: Tương tự prone to hoặc likely to.
collocations:
- phrase: held legally liable
  meaning_vi: bị quy trách nhiệm pháp lý bồi thường
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: liable for damages
  meaning_vi: có nghĩa vụ bồi thường thiệt hại
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: liable to change without notice
  meaning_vi: có thể thay đổi mà không cần báo trước
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: responsible
  meaning_vi: chịu trách nhiệm
- word: accountable
  meaning_vi: phải giải trình, chịu hậu quả
- word: answerable
  meaning_vi: có nghĩa vụ trả lời trước pháp luật
confused_words:
- word: reliable
  ipa: /rɪˈlaɪəbl/
  difference_vi: Reliable là đáng tin cậy; liable là chịu trách nhiệm pháp lý hoặc dễ bị tổn thương.
confusing_meanings:
- difference_vi: Legally liable for loss = chịu trách nhiệm pháp lý bồi thường thiệt hại; liable to change = dễ bị biến động
    thay đổi.
examples:
- en: The contractor will be held legally liable for any structural flaws discovered within three years.
  vi: Nhà thầu sẽ phải chịu trách nhiệm pháp lý đối với bất kỳ lỗi kết cấu nào được phát hiện trong vòng ba năm.
pronunciation_tips_vi: Trọng âm rơi vào âm đầu /ˈlaɪ/, âm thứ hai lướt nhẹ /əbl/, không đọc thành 'lai-a-bồ'.
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
  - vocabulary-md
  - synonyms-md
  - oxford-ref
