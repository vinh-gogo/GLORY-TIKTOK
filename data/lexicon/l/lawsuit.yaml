  uk: /ˈlɔːsjuːt/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
senses:
- id: lawsuit-1
  meaning_vi: Vụ kiện cáo, việc khởi kiện dân sự trước tòa án
  note_vi: 'Collocation kinh điển: file a lawsuit against sb (đâm đơn kiện ai ra tòa).'
collocations:
- phrase: file a lawsuit
  meaning_vi: đâm đơn khởi kiện ra tòa
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: settle a lawsuit
  meaning_vi: dàn xếp hòa giải một vụ kiện
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: threat of a lawsuit
  meaning_vi: nguy cơ bị khởi kiện trước pháp luật
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: litigation
  meaning_vi: quá trình tố tụng kiện cáo
- word: legal action
  meaning_vi: hành động pháp lý
- word: court case
  meaning_vi: vụ án tại tòa
confused_words:
- word: suit
  ipa: /suːt/
  difference_vi: Suit là bộ comple âu phục; lawsuit là vụ kiện tụng pháp đình.
confusing_meanings:
- difference_vi: File a lawsuit = đệ đơn kiện; settle a lawsuit = hòa giải giàn xếp vụ kiện ngoài tòa.
examples:
- en: The corporation filed a lawsuit against its former supplier for breach of confidentiality.
  vi: Tập đoàn đã đệ đơn kiện nhà cung cấp cũ ra tòa vì vi phạm thỏa thuận bảo mật.
pronunciation_tips_vi: Từ ghép gồm 'law' /ˈlɔː/ và 'suit' /suːt/, trọng âm chính nhấn ở âm đầu.
