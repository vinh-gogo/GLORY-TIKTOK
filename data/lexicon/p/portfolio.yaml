- word: collection
  meaning_vi: bộ sưu tập
confused_words:
- word: profile
  ipa: /ˈproʊfaɪl/
  difference_vi: Profile là hồ sơ cá nhân hoặc tóm tắt sơ lược; portfolio là bộ sưu tập tác phẩm hoặc danh mục đầu tư tài
    chính.
confusing_meanings:
- difference_vi: Investment portfolio là danh mục đầu tư tài chính; design portfolio là tập tài liệu tổng hợp các dự án thiết
    kế đã làm.
examples:
- en: Financial advisors recommend diversifying your investment portfolio to minimize market risks.
  vi: Các chuyên gia tư vấn tài chính khuyên bạn nên đa dạng hóa danh mục đầu tư để giảm thiểu rủi ro thị trường.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /ˈfoʊ/, nguyên âm uốn lưỡi /ɔːrt/ ở âm đầu.
