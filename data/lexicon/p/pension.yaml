- phrase: draw a pension
  meaning_vi: lãnh nhận tiền lương hưu
  evidence: corpus
- phrase: pension contribution
  meaning_vi: khoản đóng góp vào quỹ hưu trí
  evidence: corpus
synonyms:
- word: retirement fund
  meaning_vi: quỹ hưu trí
- word: annuity
  meaning_vi: tiền trợ cấp niên kim định kỳ
examples:
- en: All full-time employees are automatically enrolled in the corporate pension scheme.
  vi: Tất cả nhân viên chính thức đều được tự động tham gia vào chương trình hưu trí của công ty.
pronunciation_tips_vi: Âm đầu bật /p/, nguyên âm ngắn /e/, âm đuôi là /ʃn/ cong môi.
