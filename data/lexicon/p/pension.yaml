confusing_meanings:
- difference_vi: State pension là lương hưu do chính phủ chi trả; company pension plan là quỹ hưu trí do doanh nghiệp đóng
    góp.
collocations:
- phrase: pension scheme
  meaning_vi: chế độ hưu trí / chương trình lương hưu
