senses:
- id: pension-1
  meaning_vi: Lương hưu, tiền trợ cấp hưu trí định kỳ
  note_vi: Khoản chi trả cố định cho nhân viên sau khi hết tuổi lao động hoặc nghỉ hưu.
confused_words:
- word: tension
  ipa: /ˈtenʃn/
