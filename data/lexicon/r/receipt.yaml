schema_version: 3
id: receipt
lemma: receipt
pos:
- noun
ipa:
  us: /rɪˈsiːt/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- purchasing
- general-business
- finance-budgeting
senses:
- id: receipt-1
  meaning_vi: Hóa đơn mua hàng, biên lai thanh toán
  note_vi: Từ trọng tâm trong mua sắm, hoàn tiền, đổi trả hàng hóa (Part 1, 3).
collocations:
- phrase: keep the receipt
  meaning_vi: giữ lại hóa đơn biên lai
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: issue a receipt
  meaning_vi: xuất biên lai thanh toán cho khách
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: sales receipt
  meaning_vi: biên lai bán hàng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: upon receipt of
  meaning_vi: ngay sau khi nhận được (văn bản/tiền)
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: proof of purchase
  meaning_vi: bằng chứng mua hàng
confused_words:
- word: recipe
  ipa: /ˈresəpi/
  meaning: công thức nấu ăn
  kind: spelling-sound
  difference_vi: Receipt phát âm /rɪˈsiːt/ có chữ 'p' câm, nghĩa là biên lai; recipe phát âm /ˈresəpi/ nghĩa là công thức
    món ăn.
confusing_meanings:
- word: invoice
  meaning: hóa đơn yêu cầu thanh toán trước khi trả tiền
  difference_vi: Invoice là hóa đơn đòi tiền (chưa thanh toán); receipt là biên lai xác nhận bạn đã trả tiền xong.
examples:
- en: Please keep your sales receipt in case you need to exchange the item within thirty days.
  vi: Vui lòng giữ lại biên lai mua hàng trong trường hợp bạn cần đổi món hàng trong vòng ba mươi ngày.
pronunciation_tips_vi: 'ĐẶC BIỆT LƯU Ý: Chữ cái ''p'' trong receipt là ÂM CÂM! Phát âm chuẩn là /rɪˈsiːt/, tuyệt đối không
  đọc âm /p/.'
