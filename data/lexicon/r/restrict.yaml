schema_version: 3
id: restrict
lemma: restrict
pos:
- verb
ipa:
  us: /rɪˈstrɪkt/
  uk: /rɪˈstrɪkt/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- general-business
- offices
senses:
- id: restrict-1
  meaning_vi: Hạn chế, giới hạn quyền truy cập, số lượng hoặc phạm vi áp dụng
  note_vi: Đặt ra ranh giới ngăn cấm sự bành trướng hoặc xâm nhập tự do.
collocations:
- phrase: restrict access to
  meaning_vi: hạn chế quyền tiếp cận tới
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: restricted area
  meaning_vi: khu vực giới hạn ra vào
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: restrict spending
  meaning_vi: thắt chặt chi tiêu
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: limit
  meaning_vi: giới hạn
- word: confine
  meaning_vi: giam hãm, thu hẹp
- word: constrain
  meaning_vi: ràng buộc
confused_words:
- word: strict
  ipa: /strɪkt/
  difference_vi: Strict là tính từ nghiêm ngặt; restrict là động từ hạn chế, giới hạn.
confusing_meanings:
- difference_vi: Restricted area = khu vực giới hạn ra vào; restrict access = hạn chế quyền truy cập.
examples:
- en: Access to the server room is strictly restricted to certified network administrators.
  vi: Việc ra vào phòng máy chủ bị hạn chế nghiêm ngặt, chỉ dành cho các quản trị viên mạng đã được cấp chứng chỉ.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /ˈstrɪkt/, cụm phụ âm /str/ lướt nhanh dứt khoát kết thúc bằng /kt/.
