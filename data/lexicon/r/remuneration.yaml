schema_version: 3
id: remuneration
lemma: remuneration
pos:
- noun
ipa:
  us: /rɪˌmjuːnəˈreɪʃn/
  uk: /rɪˌmjuːnəˈreɪʃn/
level:
  band: advanced
  cefr: C1
  basis:
  - editorial
topics:
- personnel
- general-business
senses:
- id: remuneration-1
  meaning_vi: Khoản thù lao, tiền công và các đãi ngộ tài chính trả cho công việc
  note_vi: Thuật ngữ trang trọng bao hàm cả tiền lương, tiền thưởng và các quyền lợi đãi ngộ khác.
collocations:
- phrase: remuneration package
  meaning_vi: gói thù lao đãi ngộ tổng thể
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: adequate remuneration
  meaning_vi: mức thù lao xứng đáng, thỏa đáng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: remuneration committee
  meaning_vi: ủy ban thẩm định lương thưởng
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: compensation
  meaning_vi: tiền thù lao, bồi hoàn
- word: earnings
  meaning_vi: thu nhập
confused_words:
- word: renovation
  ipa: /ˌrenəˈveɪʃn/
  difference_vi: Renovation là sự cải tạo nâng cấp công trình; remuneration là tiền thù lao đãi ngộ lao động.
confusing_meanings:
- difference_vi: Remuneration là thuật ngữ tài chính/pháp lý chính thức, rộng hơn từ pay hoặc salary.
examples:
- en: The executive remuneration package includes base salary, stock options, and private medical cover.
  vi: Gói thù lao dành cho cấp quản lý bao gồm lương cơ bản, quyền mua cổ phiếu và bảo hiểm y tế tư nhân.
pronunciation_tips_vi: Từ có 5 âm tiết, trọng âm chính rơi vào âm tiết thứ tư /reɪ/, đừng nhầm chữ 'm' và 'n' (re-mu-ne-ra-tion).
review:
  status: ai_cross_checked
  checked_by:
  - glory-editorial
  checked_at: '2026-10-10'
  sources:
