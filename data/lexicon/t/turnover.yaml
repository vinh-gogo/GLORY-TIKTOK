schema_version: 3
id: turnover
lemma: turnover
pos:
- noun
ipa:
  us: /ˈtɜːrnoʊvər/
level:
  band: target
  cefr: B2
  basis:
  - editorial
topics:
- personnel
- general-business
- offices
senses:
- id: turnover-1
  meaning_vi: Tỷ lệ luân chuyển nhân sự (nhảy việc) / Doanh số luân chuyển vốn
  note_vi: Chủ đề giữ chân nhân tài (employee retention) hoặc tốc độ quay vòng hàng hóa.
collocations:
- phrase: high employee turnover
  meaning_vi: tỷ lệ nhân viên nhảy việc cao
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: reduce turnover
  meaning_vi: giảm thiểu tỷ lệ nhân viên nghỉ việc
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: annual turnover
  meaning_vi: doanh số hàng năm
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: staff turnover rate
  meaning_vi: tỷ lệ thay thế nhân sự
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: attrition
  meaning_vi: sự hao hụt nhân sự tự nhiên
- word: sales volume
  meaning_vi: khối lượng doanh số
confused_words:
- word: takeover
  ipa: /ˈteɪkoʊvər/
  meaning: sự thâu tóm công ty
  kind: spelling-sound
  difference_vi: Turnover là tỷ lệ nhảy việc hoặc doanh số; takeover là thương vụ mua lại thâu tóm doanh nghiệp.
confusing_meanings:
- word: retention
  meaning: sự giữ chân nhân sự
  difference_vi: Retention là tỷ lệ nhân viên ở lại gắn bó; turnover là tỷ lệ nhân viên rời bỏ công ty.
examples:
- en: Offering competitive salaries and flexible working hours helps the company reduce high employee turnover.
  vi: Cung cấp mức lương cạnh tranh và giờ làm việc linh hoạt giúp công ty giảm thiểu tỷ lệ nhân viên nhảy việc cao.
pronunciation_tips_vi: 'Từ ghép: /ˈtɜːrn/ + /oʊvər/. Trọng âm rơi vào âm tiết đầu /ˈtɜːrn-/. Chú ý âm /ɜːr/ cong lưỡi chuẩn
  giọng Mỹ.'
