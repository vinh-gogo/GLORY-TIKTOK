schema_version: 3
id: facility
lemma: facility
pos:
- noun
ipa:
  us: /fəˈsɪləti/
level:
  band: core
  cefr: B1
  basis:
  - editorial
topics:
- manufacturing
- general-business
senses:
- id: facility-1
  meaning_vi: Cơ sở vật chất, nhà máy, trang thiết bị tiện nghi
  note_vi: Từ bao quát chỉ nhà xưởng sản xuất, trung tâm thể thao, hoặc cơ sở hạ tầng văn phòng.
collocations:
- phrase: manufacturing facility
  meaning_vi: cơ sở / nhà máy sản xuất
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: state-of-the-art facility
  meaning_vi: cơ sở hạ tầng tối tân hiện đại
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: facility management
  meaning_vi: quản lý cơ sở vật chất
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
- phrase: research facility
  meaning_vi: cơ sở nghiên cứu khoa học
  evidence:
    source: unverified
    checked_at: '2026-10-10'
    note: 'legacy: ghi ''corpus'' chung chung, chưa có bằng chứng cụ thể'
synonyms:
- word: establishment
  meaning_vi: cơ sở
- word: premises
  meaning_vi: khuôn viên cơ sở
confused_words:
- word: faculty
  ipa: /ˈfæklti/
  meaning: đội ngũ giảng viên, khoa trường đại học
  kind: spelling-sound
  difference_vi: Facility là cơ sở hạ tầng vật chất; faculty là đội ngũ giảng viên hoặc khả năng trí tuệ.
confusing_meanings:
- word: building
  meaning: tòa nhà vật lý
  difference_vi: Building là công trình xây dựng gạch đá; facility là toàn bộ tổ hợp cơ sở vật chất phục vụ hoạt động cụ thể.
examples:
- en: The company invested ten million dollars to construct a state-of-the-art manufacturing facility.
  vi: Công ty đã đầu tư mười triệu đô la để xây dựng một nhà máy sản xuất hiện đại bậc nhất.
pronunciation_tips_vi: Trọng âm rơi vào âm tiết thứ hai /-ˈsɪl-/. Âm đầu là schwa /fə-/, đuôi /-ti/ đọc dứt khoát.
